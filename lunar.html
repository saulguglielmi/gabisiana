<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Ciclo Lunar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink-base: #ffd1dc;
            --pink-dark: #800040;
            --pink-accent: #ff007f;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-bg-darker: rgba(180, 20, 100, 0.35); /* Tinte más oscuro para contraste */
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--pink-base);
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #ffe6f0; }
        ::-webkit-scrollbar-thumb {
            background-color: #ff66b2;
            border-radius: 10px;
            border: 2px solid #ffe6f0;
        }
        ::-webkit-scrollbar-thumb:hover { background-color: var(--pink-accent); }

        .glass-darker {
            background: var(--glass-bg-darker);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 40px rgba(128, 0, 64, 0.3), inset 0 0 20px rgba(255,255,255,0.1);
        }

        .text-high-contrast {
            color: #ffffff;
            text-shadow: 0px 4px 12px rgba(128, 0, 64, 0.9), 0px 2px 4px rgba(255, 0, 127, 0.7);
        }

        .moon-card {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(255, 0, 127, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .moon-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 0, 127, 0.4);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Transición de página */
        #page-transition {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: var(--pink-accent);
            z-index: 9999;
            transform: translateY(0);
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .loaded #page-transition {
            transform: translateY(-100%);
        }

        /* Partículas del fondo */
        @keyframes floatUpAndSpin {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-20vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .particle {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: floatUpAndSpin linear infinite;
        }

        /* Efecto líquido y resplandor para el botón */
        .btn-liquid {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(128, 0, 64, 0.8);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-liquid::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: -1;
        }

        .btn-liquid:hover {
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5);
            color: #800040;
            text-shadow: none;
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        .btn-liquid:hover::before {
            transform: scale(1);
        }

        /* Explosión de corazones al hacer clic */
        .explosion-heart {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 1.5rem;
            animation: explode 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        /* Fondo de latido */
        @keyframes pulseBackground {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        .bg-pattern {
            animation: pulseBackground 20s ease-in-out infinite;
            transform-origin: center center;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative py-24 px-4">

    <!-- Transición al cargar -->
    <div id="page-transition"></div>

    <!-- Fondo topográfico SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" width="100vw" height="100vh" style="position:fixed; top:0; left:0; z-index:-2; pointer-events:none;">
        <rect width="100%" height="100%" fill="#ffd1dc" />
        <defs>
            <pattern id="topographic-pattern" width="600" height="600" patternUnits="userSpaceOnUse">
                <path d="M0 300 C 150 150, 450 450, 600 300 M0 150 C 150 0, 450 300, 600 150 M0 450 C 150 300, 450 600, 600 450" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.3"/>
                <path d="M0 375 C 225 180, 375 570, 600 375 M0 225 C 225 30, 375 420, 600 225 M0 525 C 225 330, 375 720, 600 525" fill="none" stroke="#ff007f" stroke-width="1" opacity="0.2"/>
                <path d="M0 75 C 300 270, 300 -30, 600 75 M0 225 C 300 420, 300 120, 600 225 M0 -75 C 300 120, 300 -180, 600 -75" fill="none" stroke="#ff007f" stroke-width="1.2" opacity="0.15"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#topographic-pattern)" class="bg-pattern" />
    </svg>

    <div id="particles-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden;"></div>

    <nav class="w-full p-6 fixed top-0 z-40 flex justify-start pointer-events-none">
        <a href="index.html" id="btn-regresar" class="btn-liquid backdrop-blur-md inline-flex items-center gap-2 px-6 py-3 rounded-full font-semibold text-sm pointer-events-auto">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Regresar al menú
        </a>
    </nav>

    <main class="w-full max-w-4xl mx-auto z-10 flex flex-col items-center">
        
        <div class="glass-darker w-full rounded-[2.5rem] p-8 md:p-12 text-center">
            
            <h1 class="text-4xl md:text-6xl font-extrabold mb-4 text-high-contrast tracking-tight drop-shadow-2xl">
                Nuestro Ciclo Lunar
            </h1>
            <p class="text-lg md:text-2xl font-medium mb-10 text-white drop-shadow-md" style="text-shadow: 0 2px 8px rgba(128, 0, 64, 0.8);">
                Así brillaba el cielo en los días que nacimos.
            </p>

            <div class="flex flex-col md:flex-row justify-center gap-8 md:gap-12 w-full">
                
                <!-- Tarjeta Luna 1 -->
                <div class="moon-card flex-1 rounded-3xl p-8 flex flex-col items-center backdrop-blur-sm">
                    <div class="text-7xl md:text-8xl mb-6 drop-shadow-[0_0_20px_rgba(255,255,255,0.8)] animate-[bounce-slow_4s_ease-in-out_infinite]">🌒</div>
                    <div class="text-high-contrast text-2xl md:text-3xl font-bold mb-2">17 de Abril, 2002</div>
                    <div class="text-pink-100 font-medium text-lg tracking-wide uppercase drop-shadow-md">Luna Creciente</div>
                </div>

                <!-- Tarjeta Luna 2 -->
                <div class="moon-card flex-1 rounded-3xl p-8 flex flex-col items-center backdrop-blur-sm" style="animation-delay: 1s;">
                    <div class="text-7xl md:text-8xl mb-6 drop-shadow-[0_0_20px_rgba(255,255,255,0.8)] animate-[bounce-slow_4s_ease-in-out_infinite_reverse]">🌔</div>
                    <div class="text-high-contrast text-2xl md:text-3xl font-bold mb-2">26 de Junio, 2007</div>
                    <div class="text-pink-100 font-medium text-lg tracking-wide uppercase drop-shadow-md">Luna Gibosa Creciente</div>
                    
                </div>

            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Eliminar pantalla de carga
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);

            createFloatingParticles();
            setupButtonEffect();
        });

        function createFloatingParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 25; 
            const elements = ['✨', '🌙', '⭐', '💫', '💖']; // Añadidas lunas y estrellas

            for (let i = 0; i < particleCount; i++) {
                createSingleParticle(container, elements);
            }
        }

        function createSingleParticle(container, elements) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            particle.innerText = elements[Math.floor(Math.random() * elements.length)];
            const size = Math.random() * 1.5 + 0.8; 
            particle.style.fontSize = `${size}rem`;
            
            particle.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 15 + 10; 
            const delay = Math.random() * -20; 
            
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;

            container.appendChild(particle);

            particle.addEventListener('animationend', () => {
                particle.remove();
                createSingleParticle(container, elements);
            });
        }

        function setupButtonEffect() {
            const btn = document.getElementById('btn-regresar');
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                const rect = this.getBoundingClientRect();
                
                // Coordenadas del click o centro del botón
                const x = e.clientX || rect.left + rect.width / 2;
                const y = e.clientY || rect.top + rect.height / 2;

                // Crear explosión de corazones
                for(let i = 0; i < 20; i++) {
                    createExplosionHeart(x, y);
                }

                // Activar transición de salida
                const transitionEl = document.getElementById('page-transition');
                transitionEl.style.transition = 'transform 0.5s ease-in';
                transitionEl.style.transform = 'translateY(0)';

                // Navegar después de la animación
                setTimeout(() => {
                    window.location.href = href;
                }, 500);
            });
        }

        function createExplosionHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('explosion-heart');
            heart.innerText = ['💖', '✨', '💕'][Math.floor(Math.random() * 3)];
            
            // Ángulo y distancia aleatoria
            const angle = Math.random() * Math.PI * 2;
            const velocity = 50 + Math.random() * 100;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            const rot = Math.random() * 360;

            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            heart.style.setProperty('--tx', `${tx}px`);
            heart.style.setProperty('--ty', `${ty}px`);
            heart.style.setProperty('--rot', `${rot}deg`);

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 800);
        }
    </script>
</body>
</html>
